<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        }

        html, body {
            width: 320px;
            background: #080a0f;
            color: #f1f5f9;
            padding: 12px;
            border: none;
            outline: none;
            box-shadow: none;
            border-radius: 0;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 7px;
            text-transform: uppercase;
        }

        .logo-dot {
            width: 7px;
            height: 7px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
            display: inline-block;
        }

        /* STATUS */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            margin-bottom: 10px;
            min-height: 44px;
        }

        .status-text {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
        }

        .status-text.error {
            color: #f87171;
        }

        .status-text.success {
            color: #34d399;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* GLASS DRAG BOX */
        .drag-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 15px 12px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1.5px dashed rgba(56, 189, 248, 0.5);
            border-radius: 8px;
            cursor: grab;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .drag-box:hover {
            border-color: #38bdf8;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.15);
        }

        .drag-box:active,
        .drag-box.dragging {
            cursor: grabbing;
            opacity: 0.6;
            border-color: #34d399;
            transform: scale(0.98);
        }

        .drag-header {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #ffffff;
            font-weight: 600;
            font-size: 13px;
        }

        .drag-dots {
            font-size: 16px;
            color: #38bdf8;
            line-height: 1;
        }

        .drag-sub {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
        }

        /* GLASS PREVIEW */
        .preview-box {
            display: none;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            padding: 8px 10px;
            max-height: 85px;
            overflow-y: auto;
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.4;
            user-select: text;
            cursor: text;
            white-space: pre-wrap;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }

        /* ACTIONS */
        .action-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-glass {
            flex: 1;
            padding: 7px 8px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-glass.primary {
            background: rgba(56, 189, 248, 0.14);
            border-color: rgba(56, 189, 248, 0.35);
            color: #38bdf8;
        }

        .btn-glass.primary:hover {
            background: rgba(56, 189, 248, 0.24);
            color: #ffffff;
        }

        .footer-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 10px;
            color: #64748b;
        }

        .safe-tag {
            color: #34d399;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-title">
            <span class="logo-dot"></span>
            GSAK
        </div>
    </div>

    <!-- SCANNING STATUS -->
    <div class="status-container" id="status-container">
        <div class="spinner" id="spinner"></div>
        <span class="status-text" id="status-text">Scanning question...</span>
    </div>

    <!-- DRAGGABLE CARD -->
    <div class="drag-box" id="drag-box" draggable="true">
        <div class="drag-header">
            <span class="drag-dots">⠿</span>
            <span>Drag Question to Any App</span>
        </div>
        <div class="drag-sub" id="drag-sub">
            Drop into ChatGPT, Notepad, VS Code...
        </div>
    </div>

    <!-- GLASS PREVIEW -->
    <div class="preview-box" id="preview-box" title="You can also highlight and drag text directly from here"></div>

    <!-- EXTRA ACTIONS -->
    <div class="action-row" id="action-row" style="display: none;">
        <button class="btn-glass primary" id="copy-btn">
            <span>📋</span> Copy Text
        </button>
        <button class="btn-glass" id="pin-btn">
            <span>📌</span> Pin to Page
        </button>
        <button class="btn-glass" id="select-btn">
            <span>📑</span> Select All
        </button>
    </div>

    <div class="footer-info">
        <span class="safe-tag">🛡️ Proctor Safe</span>
        <span id="char-count"></span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
