<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradstreet Copy Helper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 270px;
            background: #0f172a;
            color: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            overflow: hidden;
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }

        .title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            font-size: 10px;
            background: #2563eb;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .status-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px 10px;
            text-align: center;
            margin-bottom: 10px;
            min-height: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .status-text {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
        }

        .status-text.success {
            color: #34d399;
            font-weight: 600;
        }

        .status-text.error {
            color: #f87171;
        }

        .sub-text {
            font-size: 10px;
            color: #64748b;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        button {
            flex: 1;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 500;
            border: none;
            border-radius: 5px;
            background: #334155;
            color: #f8fafc;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover {
            background: #475569;
        }

        button.primary {
            background: #2563eb;
        }

        button.primary:hover {
            background: #1d4ed8;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">
            <span>📋</span> Gradstreet Helper
        </div>
        <span class="badge">v2.2.0</span>
    </div>

    <div class="status-box" id="status-box">
        <div class="spinner" id="spinner"></div>
        <div class="status-text" id="status-text">Detecting question...</div>
        <div class="sub-text" id="sub-text">Please wait</div>
    </div>

    <div class="btn-group">
        <button id="copy-btn">📋 Re-copy</button>
        <button class="primary" id="paste-btn">📥 Paste Code</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
