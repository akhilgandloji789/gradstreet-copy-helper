<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradstreet Helper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 290px;
            background: #0f172a;
            color: #f8fafc;
            padding: 14px;
            border-radius: 10px;
            overflow: hidden;
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }

        .title {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            font-size: 10px;
            background: #10b981;
            color: #ffffff;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: #1e293b;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #334155;
            min-height: 44px;
        }

        .status-text {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
        }

        .status-text.error {
            color: #f87171;
        }

        .status-text.success {
            color: #34d399;
            font-weight: 600;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* DRAG AND DROP BOX */
        .drag-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 12px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px dashed #38bdf8;
            border-radius: 8px;
            cursor: grab;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
        }

        .drag-box:hover {
            border-color: #60a5fa;
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.2);
        }

        .drag-box:active,
        .drag-box.dragging {
            cursor: grabbing;
            opacity: 0.6;
            border-color: #10b981;
            transform: scale(0.98);
        }

        .drag-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #38bdf8;
            font-weight: 700;
            font-size: 13px;
        }

        .drag-icon-dots {
            font-size: 18px;
            line-height: 1;
            letter-spacing: -2px;
            color: #94a3b8;
        }

        .drag-sub {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
        }

        .footer-note {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: #64748b;
            padding-top: 6px;
        }

        .shield-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #34d399;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">
            <span>📋</span> Gradstreet Helper
        </div>
        <span class="badge">No Clipboard</span>
    </div>

    <div class="status-container" id="status-container">
        <div class="spinner" id="spinner"></div>
        <span class="status-text" id="status-text">Scanning question...</span>
    </div>

    <!-- DRAGGABLE CARD -->
    <div class="drag-box" id="drag-box" draggable="true">
        <div class="drag-header">
            <span class="drag-icon-dots">⠿</span>
            <span>Drag Question to Any App</span>
        </div>
        <div class="drag-sub" id="drag-sub">
            Drop into ChatGPT, Notepad, VS Code...
        </div>
    </div>

    <div class="footer-note">
        <span class="shield-tag">🛡️ Zero Clipboard Trace</span>
        <span id="char-count"></span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
