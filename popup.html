<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradstreet Copy Helper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 250px;
            background: #0f172a;
            color: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            overflow: hidden;
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #334155;
        }

        .title {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            font-size: 10px;
            background: #2563eb;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .status-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px 8px;
            text-align: center;
            margin-bottom: 8px;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .status-icon {
            font-size: 18px;
            line-height: 1;
        }

        .status-text {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
        }

        .status-text.success {
            color: #34d399;
            font-weight: 600;
        }

        .status-text.error {
            color: #f87171;
        }

        .sub-text {
            font-size: 10px;
            color: #64748b;
        }

        .btn-group {
            display: flex;
        }

        button {
            width: 100%;
            padding: 7px 10px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.15s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">
            <span>📋</span> Gradstreet Helper
        </div>
        <span class="badge">v2.2.1</span>
    </div>

    <div class="status-box" id="status-box">
        <div class="spinner" id="spinner"></div>
        <div class="status-icon" id="status-icon" style="display: none;">📋</div>
        <div class="status-text" id="status-text">Scanning question...</div>
        <div class="sub-text" id="sub-text">Please wait</div>
    </div>

    <div class="btn-group">
        <button id="recopy-btn">
            <span>🔄</span> Re-Copy Question
        </button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
